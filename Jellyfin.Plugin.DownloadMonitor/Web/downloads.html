<div id="downloadMonitorPage" data-role="page" class="page libraryPage type-interior pluginConfigurationPage mainAnimatedPage">

    <div class="padded-top-page padded-left padded-right padded-bottom-page">
        <div class="verminderBreedte">

        <div class="flex align-items-center justify-content-between" style="margin-bottom: 2em;">
            <h1 class="pageTitle" style="margin: auto;">
                Downloads
            </h1>
        </div>

        <div id="download-list-container" class="itemsContainer vertical-list">
            <div class="padded-top padded-bottom" style="text-align: center;">
                <span class="material-icons" style="font-size: 2em; animation: spin 1s linear infinite;">sync</span>
            </div>
        </div>
        </div>

    </div>

    <style>
        .verminderBreedte {
            max-width: 60%;
            margin: 0 auto;
        }
        @media (max-width: 720px) {
            .verminderBreedte {
                max-width: 95%;
            }
        }
        .download-progress-background {
            background-color: rgba(255, 255, 255, 0.1);
            height: 4px;
            border-radius: 2px;
            overflow: hidden;
            margin-top: 5px;
        }
        .download-progress-value {
            background-color: #00a4dc;
            height: 100%;
            transition: width 0.5s ease-out;
        }
        /* Zorgt dat de tekstkleur goed is in dark mode */
        .listItemBodyText.secondary {
            color: var(--theme-text-secondary-color, #ccc);
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>

    <script type="text/javascript">
        (function() {
            // Let op: we zoeken nu specifiek binnen deze pagina
            const page = document.getElementById('downloadMonitorPage');
            const container = page ? page.querySelector('#download-list-container') : null;

            async function fetchDownloads() {
                if (!container) return;

                let refreshInterval = 2000;

                while (document.body.contains(page)){
                    try {
                    const response = await fetch('/Plugins/DownloadMonitor/Downloads');
                        if (response.ok) {
                            const data = await response.json();

                            if (data.refreshInterval) {
                                refreshInterval = data.refreshInterval;
                            }

                            // Support voor zowel {records: []} als {queue: []} formaten
                            renderDownloads(data.records || data.queue || []);
                        } else {
                            renderError();
                        }
                    } catch (err) {
                    console.error('[DownloadMonitor] Error fetching downloads:', err);
                    renderError();
                    }

                    await new Promise(resolve => setTimeout(resolve, refreshInterval));
                }

            }

            function renderError() {
                if(container) container.innerHTML = '<div class="padded-top padded-bottom" style="text-align: center;">Error loading downloads.</div>';
            }

            function renderDownloads(items) {
                if (!container) return;

                if (items.length === 0) {
                    container.innerHTML = '<div class="padded-top padded-bottom" style="text-align: center;">No active downloads.</div>';
                    return;
                }

                const sortedItems = items.map(item => {
                    let displayName = item.title || "Unknown";

                    if (item.mediaType === 'movie' && item.movie) {
                        const movieTitle = item.movie.title;
                        const movieYear = item.movie.year;
                        displayName = movieTitle ? (movieYear ? `${movieTitle} (${movieYear})` : movieTitle) : displayName;
                    } else if (item.mediaType === 'series' && item.series) {
                        const seriesTitle = item.series.title;
                        let seasonNum = null;
                        if (item.episode && typeof item.episode.seasonNumber === 'number') {
                            seasonNum = item.episode.seasonNumber;
                        }

                        if (seriesTitle) {
                            if (seasonNum !== null && seasonNum !== undefined) {
                                displayName = `${seriesTitle} - Season ${seasonNum}`;
                            } else {
                                displayName = seriesTitle;
                            }
                        }
                    }

                    const status = item.status || "Unknown";
                    const total = Number(item.size) || 0;
                    const left = Number(item.sizeleft) || 0;

                    item.displayName = displayName;
                    item.progress = total > 0 ? Math.round(((total - left) / total) * 100) : 0;
                    if (total === 0) {
                        item.progress = 0;
                    }
                    return item;

                }).sort((a, b) => b.progress - a.progress);

                const html = sortedItems.map(item => {
                    const iconName = item.mediaType === 'series' ? 'tv' : 'movie';
                    return `
                        <div class="listItem listItem-border" style="display: flex; align-items: center; gap: 1.2em; padding: 1em 0.5em;">
                            <span class="material-icons" style="font-size: 24px; color: var(--theme-text-secondary-color, #ccc); flex-shrink: 0;">${iconName}</span>
                            <div class="listItemBody" style="flex: 1; margin: 0; padding: 0;">
                                <div class="listItemBodyText">${item.displayName}</div>
                                <div class="listItemBodyText secondary" style="display: flex; align-items: center; gap: 0.5em; margin-top: 2px;">
                                    <span>${item.status || "Unknown"}</span>
                                    <span>&bull;</span>
                                    <span>${item.progress}%</span>
                                </div>
                                <div class="download-progress-background" style="margin-top: 8px;">
                                    <div class="download-progress-value" style="width: ${item.progress}%"></div>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');

                container.innerHTML = html;
            }

            // Init
            fetchDownloads();

            // Listen for refresh (gebruik 'page' variabele i.p.v. querySelector om zeker te zijn)
            if (page) {
                page.addEventListener('refresh-downloads', fetchDownloads);
            }

        })();
    </script>
</div>
